[workspace]
resolver = "2"
members = [
    "crates/floatile-core",
    "crates/floatile-shell",
    "crates/floatile-platform",
    "crates/floatile-plugin-api",
    "crates/floatile-runtime",
    "crates/floatile-services",
    "crates/floatile-store",
    "crates/floatile-sdk",
    "crates/floatile-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "PROPRIETARY"
authors = ["Floatile Project"]

[workspace.dependencies]
floatile-core = { path = "crates/floatile-core", version = "0.1.0" }
floatile-platform = { path = "crates/floatile-platform", version = "0.1.0" }
floatile-store = { path = "crates/floatile-store", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
slint = { version = "1.17", features = ["backend-winit", "unstable-winit-030"] }
winit = "0.30"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.release]
lto = true
strip = true

[profile.dev]
opt-level = 1
