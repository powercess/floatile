name: TypeScript runtime candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/typescript-runtime-candidate.yml"
      - "conformance/**"
      - "crates/floatile-runtime/**"
      - "sdk/typescript/**"
      - "spikes/typescript-runtime/**"
      - "wit/**"

permissions:
  contents: read

concurrency:
  group: typescript-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPONENTIZE_QJS_SHA: 7788644697ed08a841ad0910d4e99772c6fe7132
  CARGO_INCREMENTAL: 0

jobs:
  quickjs:
    name: QuickJS candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Floatile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: floatile
          persist-credentials: false

      - name: Checkout fixed componentize-qjs candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andreiltd/componentize-qjs
          ref: refs/pull/76/head
          path: componentize-qjs
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        working-directory: componentize-qjs
        run: test "$(git rev-parse HEAD)" = "$COMPONENTIZE_QJS_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.3.0

      - name: Build fixed componentize-qjs CLI
        working-directory: componentize-qjs
        run: cargo build --release -p componentize-qjs-cli --features opt-size

      - name: Install locked TypeScript toolchains
        shell: bash
        working-directory: floatile
        run: |
          pnpm install --dir sdk/typescript --frozen-lockfile
          pnpm install --dir spikes/typescript-runtime --frozen-lockfile

      - name: Build Floatile TypeScript component
        shell: bash
        working-directory: floatile
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            candidate="$(cd ../componentize-qjs && pwd -W)/target/release/componentize-qjs.exe"
          else
            candidate="$(cd ../componentize-qjs && pwd)/target/release/componentize-qjs"
          fi
          FLOATILE_SPIKE_DISABLE_RUSTC_WRAPPER=1 \
            FLOATILE_COMPONENTIZE_QJS_BIN="$candidate" \
            pnpm --dir spikes/typescript-runtime build:quickjs

      - name: Run Linux behavior and security vectors
        if: runner.os == 'Linux'
        working-directory: floatile
        env:
          FLOATILE_SPIKE_DISABLE_RUSTC_WRAPPER: "1"
        run: pnpm --dir spikes/typescript-runtime test:quickjs
