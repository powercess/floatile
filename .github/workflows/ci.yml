name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      # 缓存 ~/.cargo 注册表与 target/(按 Cargo.lock + 工具链分 key,跨平台各自独立)。
      # 显著减少三平台重复编译同一依赖集的时间;cache-key 变化时自动失效并重建。
      # 注意:clock-wasm 独立 manifest 构建的 wasm 产物也落在 workspace 根 target/,
      # 故仅声明根工作区即可覆盖全部产物(含 wasm32-wasip2 target 依赖)。
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Enforce LF and UTF-8 (no CRLF/BOM)
        shell: bash
        run: |
          set -euo pipefail
          bad=
          if git ls-files --eol | grep -Eq '^i/(crlf|mixed)'; then
            bad=yes
            echo "::error::CRLF/mixed line endings in the git index; run 'git add --renormalize .' and commit." >&2
            git ls-files --eol | grep -E '^i/(crlf|mixed)' | sed 's/^/  /'
          fi
          while IFS= read -r -d '' f; do
            if head -c 3 "$f" | od -An -tx1 | grep -q 'ef bb bf'; then
              bad=yes
              echo "::error::UTF-8 BOM in tracked file: $f" >&2
            fi
          done < <(git ls-files -z)
          test -z "$bad"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --exclude floatile-clock-wasm --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --exclude floatile-clock-wasm --all-targets --locked -- -D warnings
      - name: Build WASI guest (hermetic integration tests)
        # 集成测试读取 target/wasm32-wasip2/debug 下的组件；先构建保证干净
        # checkout 上测试不依赖执行顺序或测试内并发构建。
        run: cargo build --manifest-path plugins/clock-wasm/Cargo.toml --target wasm32-wasip2 --locked
      - name: Test
        run: cargo test --workspace --exclude floatile-clock-wasm --all-targets --locked
      - name: Release build
        run: cargo build --workspace --exclude floatile-clock-wasm --release --locked
      - name: WASI guest validate and WIT single-source check
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.254.0/wasm-tools-1.254.0-x86_64-linux.tar.gz \
            | tar xz -C /usr/local/bin --strip-components=1 wasm-tools-1.254.0-x86_64-linux/wasm-tools
          wasm-tools validate target/wasm32-wasip2/debug/floatile_clock_wasm.wasm
          sdk=$(grep -oP 'ENGINE_API_VERSION: &str = "\K[^"]+' crates/floatile-sdk/src/lib.rs)
          api=$(grep -oP 'ENGINE_API_VERSION: &str = "\K[^"]+' crates/floatile-plugin-api/src/lib.rs)
          test "$sdk" = "$api"
          echo "guest component valid; WIT single-source OK (engineApiVersion=$sdk)"

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry for dependency check
        # cargo-deny 在 Docker 内运行,缓存宿主 ~/.cargo/registry 可复用已下载的
        # AdvisoryDB 与索引,减少每次重复拉取。
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          arguments: --locked
          command: check advisories bans sources
