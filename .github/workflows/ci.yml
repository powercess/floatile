name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Enforce LF and UTF-8 (no CRLF/BOM)
        shell: bash
        run: |
          set -euo pipefail
          bad=
          if git ls-files --eol | grep -Eq '^i/(crlf|mixed)'; then
            bad=yes
            echo "::error::CRLF/mixed line endings in the git index; run 'git add --renormalize .' and commit." >&2
            git ls-files --eol | grep -E '^i/(crlf|mixed)' | sed 's/^/  /'
          fi
          while IFS= read -r -d '' f; do
            if head -c 3 "$f" | od -An -tx1 | grep -q 'ef bb bf'; then
              bad=yes
              echo "::error::UTF-8 BOM in tracked file: $f" >&2
            fi
          done < <(git ls-files -z)
          test -z "$bad"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: WASI guest check
        if: runner.os == 'Linux'
        run: cargo check -p floatile-sdk --target wasm32-wasip2 --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          arguments: --locked
          command: check advisories bans sources
