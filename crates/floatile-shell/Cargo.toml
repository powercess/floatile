[package]
name = "floatile-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "floatile-shell"
path = "src/main.rs"

[[bin]]
name = "floatile-preview-host"
path = "src/bin/preview_host.rs"

[dependencies]
floatile-cli = { workspace = true }
floatile-core = { workspace = true }
floatile-platform = { workspace = true }
floatile-renderer = { workspace = true }
floatile-store = { workspace = true }
floatile-ui-schema = { workspace = true }
floatile-runtime = { workspace = true }
floatile-plugin-api = { workspace = true }
floatile-services = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
# ADR-0002：运行时第三方插件 UI 渲染依赖 slint-interpreter 编译 renderer 生成的源码。
# 与 `slint!` 宏共用同一 compiler/core（1.17 同版本），不引入 slint-build 图像/AVIF 链
# （规避 RUSTSEC-2024-0436）。运行时编译入口按不受信任输入预算（RUI_* 前置拒绝）。
slint-interpreter = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 构建期生成参考时钟的 widget.ftui（单一事实源），不把 guest SDK 链入宿主二进制。
[build-dependencies]
floatile-clock-model = { workspace = true }
floatile-renderer = { workspace = true }
floatile-ui-schema = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
floatile-clock-model = { workspace = true }
floatile-renderer = { workspace = true }
