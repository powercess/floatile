[package]
name = "floatile-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "floatile-shell"
path = "src/main.rs"

[dependencies]
floatile-core = { workspace = true }
floatile-platform = { workspace = true }
floatile-store = { workspace = true }
floatile-ui-schema = { workspace = true }
floatile-runtime = { workspace = true }
floatile-plugin-api = { workspace = true }
floatile-services = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 构建期生成参考时钟的 widget.ftui（单一事实源），不把 guest SDK 链入宿主二进制。
[build-dependencies]
floatile-clock-wasm = { path = "../../plugins/clock-wasm", version = "0.1.0" }
floatile-renderer = { workspace = true }
floatile-ui-schema = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
floatile-clock-wasm = { path = "../../plugins/clock-wasm", version = "0.1.0" }
floatile-renderer = { workspace = true }
# ADR-0002 spike 验证：运行时编译 renderer 生成的插件 UI（vs 编译期 slint! 嵌入）。
# 仅 dev 使用，不进入宿主生产依赖；ADR 通过后按决策决定是否升为正式依赖。
slint-interpreter = "1.17"
